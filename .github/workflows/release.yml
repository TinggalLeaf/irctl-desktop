name: Release

on:
  push:
    branches: [main]   # release-please 维护 Release PR
    tags: ['v*']       # 打 tag 触发全平台构建发布
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.0），需已存在'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          # release-please-config.json / .release-please-manifest.json 位于仓库根目录

  build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  target: x86_64-pc-windows-msvc,    label: windows-x64 }
          - { os: windows-11-arm,  target: aarch64-pc-windows-msvc,   label: windows-arm64 }
          - { os: ubuntu-22.04,    target: x86_64-unknown-linux-gnu,  label: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, label: linux-arm64 }
          - { os: macos-13,        target: x86_64-apple-darwin,       label: macos-x64 }
          - { os: macos-latest,    target: aarch64-apple-darwin,      label: macos-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libudev-dev pkg-config patchelf libxdo-dev

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri app (installers)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      - name: Package portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.target }}/release/irctl-desktop.exe"
          Compress-Archive -Path $exe -DestinationPath "irctl-desktop_${{ env.TAG }}_${{ matrix.label }}_portable.zip" -Force

      - name: Package portable (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C "src-tauri/target/${{ matrix.target }}/release" -czf "irctl-desktop_${TAG}_${{ matrix.label }}_portable.tar.gz" irctl-desktop

      - name: Package portable (macOS .app)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/irctl-desktop.app" \
            "irctl-desktop_${TAG}_${{ matrix.label }}_portable.zip"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          generate_release_notes: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            irctl-desktop_${{ env.TAG }}_${{ matrix.label }}_portable.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
