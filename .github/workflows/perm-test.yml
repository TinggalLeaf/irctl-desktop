name: perm-test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Test cross-run asset upload with error output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo dummy > dummy.txt
          gh release upload v0.1.1 dummy.txt --clobber 2>&1; echo "upload exit: $?"
