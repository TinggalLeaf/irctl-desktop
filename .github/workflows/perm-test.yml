name: perm-test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Test GITHUB_TOKEN release write capabilities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          echo "--- 1. plain PATCH ---"
          gh api -X PATCH repos/${{ github.repository }}/releases/368655967 -f name="v0.1.1" --jq .name || echo "PLAIN_PATCH_FAILED"
          echo "--- 2. PATCH with generate_release_notes ---"
          gh api -X PATCH repos/${{ github.repository }}/releases/368655967 -F generate_release_notes=true --jq .name || echo "GEN_NOTES_PATCH_FAILED"
          echo "--- 3. asset upload ---"
          echo dummy > dummy.txt
          gh release upload v0.1.1 dummy.txt --clobber && echo UPLOAD_OK || echo "UPLOAD_FAILED"
          echo "--- 4. cleanup dummy asset ---"
          gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$(gh api repos/${{ github.repository }}/releases/368655967 --jq '.assets[] | select(.name=="dummy.txt") | .id')" && echo CLEANUP_OK || echo "CLEANUP_FAILED"
